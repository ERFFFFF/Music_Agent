# Build the Windows binaries and attach them to a release.
#
# This exists because the two build scripts only run on Windows — PyInstaller freezes for the platform
# it runs on, and Inno Setup is a Windows compiler — so a release cut from anywhere else has notes and
# nothing to download. A tag now builds on a real Windows runner and uploads both artifacts itself.
#
#   push a v* tag        -> builds and uploads to that tag's release
#   run it by hand       -> same, for a tag that already exists (Actions > Build Windows binaries)
#
# The release notes are NOT written here. A release is a thing someone writes; this only puts the
# binaries on it.
name: Build Windows binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and upload to (e.g. v4.6.0)"
        required: true

permissions:
  contents: write        # to upload assets onto the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      # The dispatch input is a string a human types, and it goes on to be a git ref and a shell
      # argument. Only someone with write access can dispatch, so this is not a hostile input — but
      # "not hostile" is not "well-formed", and both of those uses deserve a value that has been
      # looked at. Everything downstream reads this step's output, never the raw input.
      - name: Work out which tag to build
        id: which
        # The ref name goes through env too: a tag name may legally hold $(...), which pwsh would run inside "...".
        env:
          REQUESTED: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $tag = if ($env:REQUESTED) { $env:REQUESTED } else { $env:REF_NAME }
          if ($tag -notmatch '^v[0-9][0-9A-Za-z.\-+]*$') { throw "not a version tag: '$tag'" }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/${{ steps.which.outputs.tag }}
          # nothing after this runs git; gh reads GH_TOKEN
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # >=3.10 from the app, <3.16 from PyInstaller (see requirements-gui.txt). Pinned rather than
          # "3.x" so a new interpreter cannot silently change what ships.
          python-version: "3.12"

      - name: Install Inno Setup
        # 6.7.1 is what built v4.6.1 and what windows-latest preinstalls; without --allow-downgrade
        # choco exits 1 once the image ships a newer build.
        run: choco install innosetup --version 6.7.1 --allow-downgrade -y --no-progress

      # The installer FIRST: build_installer.ps1 starts by deleting dist\, so building it after the
      # portable exe would throw that exe away.
      - name: Build the installer
        run: .\installer\build_installer.ps1

      - name: Build the portable exe
        run: .\build_portable.ps1

      - name: Check both artifacts exist
        # PyInstaller can fail in ways that still exit 0, and an empty upload is worse than a failed
        # build: the release looks complete and the download is missing.
        shell: pwsh
        run: |
          $missing = @("dist\MusicAgent_portable.exe", "installer_output\MusicAgentSetup.exe") |
                     Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "build produced nothing at: $($missing -join ', ')" }
          Get-ChildItem dist\MusicAgent_portable.exe, installer_output\MusicAgentSetup.exe |
            Select-Object Name, Length

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.which.outputs.tag }}
        shell: pwsh
        run: |
          # A tag can be pushed before its release is written, and `gh release upload` needs one to
          # exist — that failed a build whose binaries were already sitting right there. Open a DRAFT
          # if there is none, so the artifacts always land somewhere and a human still writes the
          # notes; a real release that already exists is left exactly as it is.
          gh release view "$env:TAG" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:TAG" --draft --title "$env:TAG" --notes "Binaries built by CI. Notes not written yet."
          }
          # --clobber so a re-run replaces the assets instead of failing on "already exists".
          gh release upload "$env:TAG" dist\MusicAgent_portable.exe installer_output\MusicAgentSetup.exe --clobber

      # Kept for a build that was NOT for a release (a dispatch against a tag whose release was
      # deleted, say) — the upload above would fail there, and the binaries would otherwise be lost.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: MusicAgent-windows
          path: |
            dist/MusicAgent_portable.exe
            installer_output/MusicAgentSetup.exe
          if-no-files-found: warn
