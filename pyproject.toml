[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-agent"
version = "4.6.1"
description = "Global hotkeys for whatever is playing your music - a Cadence account, or Spotify Connect"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ERFFFFF" }]

# EMPTY, and that is the headline. The CLI and both backends run on the standard library alone:
# `requests` was replaced by music_agent/net/httpmin.py and `keyboard` by music_agent/win32/hotkeys.py.
# Nothing here is aspirational - `python -m music_agent` works on a clean interpreter.
dependencies = []

[project.optional-dependencies]
# Only the tray app needs anything, and only because a GUI toolkit is not something to hand-roll.
# `keyboard` survives here alone: ui/settings.py RECORDS a keypress, which RegisterHotKey cannot do.
gui = [
    "customtkinter==6.0.0",
    "pystray==0.19.5",
    # Pillow 13 needs Python >=3.11 (the CLI above still runs on 3.10). 13.0.0 fixes CVE-2026-96778 & co.
    "Pillow==13.0.0",
    "keyboard==0.13.5",
]
# Test runner only. Never imported by the app -- the runtime dependency list above stays empty.
dev = ["pytest>=8", "ruff==0.16.9"]   # exact: ruff 0.16.0 changed the default rule set; configured below

[project.scripts]
music-agent = "music_agent.cli:main"

[project.gui-scripts]
# gui-scripts, not scripts: this one gets the pythonw launcher, so a double-click opens no console.
music-agent-tray = "music_agent.ui.tray:main"

[project.urls]
Homepage = "https://github.com/ERFFFFF/Music_Agent"

[tool.setuptools.packages.find]
where = ["src"]                # src layout: the package is importable only once installed, which is
                               # the point -- a test run cannot accidentally pick up the source tree
                               # instead of the thing that was built.

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-q` because these are assert-based checks, not a report to read line by line.
addopts = "-q"



[tool.ruff]
line-length = 108              # the width this codebase is already written and commented at
target-version = "py310"

[tool.ruff.lint]
# the pre-0.16 default set this code is written against (0.16 widened it to 413 rules)
select = ["E4", "E7", "E9", "F"]
